# Place at .github/workflows/ci.yml in your fork.
#
# Repository VARIABLES to create (Settings > Secrets and variables > Actions > Variables):
#   VAULT_ADDR         e.g. https://your-domain.ngrok-free.app
#   SONAR_ORGANIZATION your SonarCloud organization key
#   SONAR_PROJECT_KEY  your SonarCloud project key (e.g. org_spring-petclinic)
# No GitHub *secrets* are needed: everything sensitive comes from Vault via OIDC.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write # required to mint the OIDC token Vault verifies

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Gate 1: fast feedback ────────────────────────────────────────────
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run JUnit tests
        run: ./mvnw -B test

  # ── Gate 2: static analysis + coverage, token fetched from Vault ─────
  sonar:
    name: sonar
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Sonar needs full history for blame / new-code detection

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Cache Sonar packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}

      - name: Fetch SONAR_TOKEN from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ vars.VAULT_ADDR }}
          method: jwt
          role: petclinic-ci
          jwtGithubAudience: petclinic-vault
          extraHeaders: |
            ngrok-skip-browser-warning: true
          secrets: |
            secret/data/petclinic/sonar token | SONAR_TOKEN

      - name: Build, test with coverage, analyse
        # SONAR_TOKEN is exported to this job's environment only and masked in logs.
        # qualitygate.wait makes this step FAIL when the SonarCloud gate fails.
        run: >
          ./mvnw -B verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=300

  # ── Gate 3: end-to-end browser test ──────────────────────────────────
  e2e:
    name: e2e
    needs: [unit-tests, sonar]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: e2e/requirements.txt

      - name: Fetch DB credentials from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ vars.VAULT_ADDR }}
          method: jwt
          role: petclinic-ci
          jwtGithubAudience: petclinic-vault
          extraHeaders: |
            ngrok-skip-browser-warning: true
          secrets: |
            secret/data/petclinic/db username | DB_USER ;
            secret/data/petclinic/db password | DB_PASS ;
            secret/data/petclinic/db database | DB_NAME

      - name: Start throwaway PostgreSQL with the Vault credentials
        run: |
          docker run -d --name petclinic-db \
            -e POSTGRES_USER="$DB_USER" \
            -e POSTGRES_PASSWORD="$DB_PASS" \
            -e POSTGRES_DB="$DB_NAME" \
            -p 5432:5432 postgres:17
          for i in $(seq 1 30); do
            docker exec petclinic-db pg_isready -U "$DB_USER" -d "$DB_NAME" && exit 0
            sleep 2
          done
          echo "Postgres did not become ready" && docker logs petclinic-db && exit 1

      - name: Build PetClinic
        run: ./mvnw -B -DskipTests package

      - name: Boot PetClinic in the background
        run: |
          JAR=$(ls target/spring-petclinic-*.jar | grep -v original | head -n1)
          POSTGRES_URL="jdbc:postgresql://localhost:5432/${DB_NAME}" \
          POSTGRES_USER="$DB_USER" \
          POSTGRES_PASS="$DB_PASS" \
          nohup java -jar "$JAR" --spring.profiles.active=postgres > app.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fs http://localhost:8080/ >/dev/null && echo "App is up" && exit 0
            sleep 2
          done
          echo "App did not start" && cat app.log && exit 1

      - name: Run Selenium test
        run: |
          pip install -r e2e/requirements.txt
          pytest -v e2e/test_register_pet.py
        env:
          BASE_URL: http://localhost:8080

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: |
            app.log
            e2e/*.png
          if-no-files-found: ignore
